name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: Bridge — typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The offline simulation is the end-to-end check: it exercises the full
      # pipeline with no credentials, so CI never touches a real system.
      - run: npm run simulate asthma
      - run: npm run simulate depression

  dashboard:
    name: Dashboard — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  secrets:
    name: No committed credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a .env file was committed
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked — it must never be committed."
            exit 1
          fi
          echo "No tracked .env file."
